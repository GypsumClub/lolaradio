/* ============================================
   2. RESET & BASE - EDIT GLOBAL STYLES HERE
   ============================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); overscroll-behavior: none; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}
/* iOS no-zoom - 16px prevents auto-zoom */
input, textarea, select { font-size: 16px !important; }
button { font-family: inherit; cursor: pointer; }

/* ============================================
   3. LAYOUT - CONTAINERS
   ============================================ */
#app-root {
  min-height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
  position: relative;
  overflow-x: clip;
  overflow-y: auto;
  padding-top: var(--safe-top);
  background: var(--bg);
  color: var(--text);
  transition: background 400ms ease, color 400ms ease;
}
/* Ambient glow - solid only, no grey pull */
.ambient-glow {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.ambient-blob {
  position: absolute;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: min(860px, 92vw);
  max-width: 92vw;
  height: 720px;
  border-radius: 9999px;
  filter: blur(120px);
  transition: all 600ms ease;
}
/* Main shell - 430px max like phone */
#main-shell {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 430px;
  padding: 24px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ============================================
   4. HEADER - STATION NAME & ON AIR
   ============================================ */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* EDIT HERE: Menu button - hamburger */
#menu-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--pill-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 4px 14px #00000012;
  transition: transform 200ms ease;
}
#menu-btn:hover { transform: scale(1.04); }
#menu-btn:active { transform: scale(0.96); }
#menu-btn span {
  display: block;
  width: 16px;
  height: 1.6px;
  border-radius: 9999px;
  background: var(--text);
}
/* EDIT HERE: Station name pill */
#station-pill {
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: var(--radius-pill);
  padding: 6px 6px 6px 18px;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 4px 14px #00000012;
  transition: transform 200ms ease;
}
#station-pill:hover { transform: scale(1.02); }
#station-pill:active { transform: scale(0.98); }
.station-name-text {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
}
/* EDIT HERE: Rename icon - needs good contrast */
.rename-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
  background: var(--btn-ghost-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 200ms ease;
}
.rename-icon svg path {
  stroke: var(--text-dim);
}
[data-theme="ultramarine"] .rename-icon svg path {
  stroke: #0044FF;
}
.rename-icon:hover { transform: scale(1.05); }
/* EDIT HERE: Station edit input */
#station-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--radius-pill);
  padding: 9px 16px;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg-strong);
  backdrop-filter: blur(20px);
}
#station-edit input {
  background: transparent;
  border: 0;
  outline: 0;
  width: 120px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
/* EDIT HERE: ON AIR pill */
#on-air-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  border-radius: var(--radius-pill);
  padding: 10px 14px;
  border: 1px solid var(--glass-border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: all 400ms ease, transform 200ms ease;
  background: var(--pill-bg);
  color: #8A8A8A;
}
#on-air-btn.live {
  background: var(--live-bg);
  border-color: var(--live-border);
  color: var(--live-text);
  box-shadow: 0 0 0 1px var(--live-border), 0 0 22px var(--live-dot);
}
#on-air-btn:hover { transform: scale(1.02); }
#on-air-btn:active { transform: scale(0.97); }
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: #B0B0B0;
}
#on-air-btn.live .live-dot {
  background: var(--live-dot);
  box-shadow: 0 0 10px var(--live-dot);
  animation: pulseDot 1.4s ease-in-out infinite;
}

/* ============================================
   5. MESSAGE DISPLAY - MAIN CARD
   ============================================ */
/* EDIT HERE: Outer card - parent 20px radius */
#station-card {
  border-radius: var(--radius-outer);
  padding: 10px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 8px 24px var(--glass-shadow);
  transition: all 400ms ease;
}
/* EDIT HERE: Inner card - nested 12px radius, uniform spacing */
#message-card-inner {
  border-radius: var(--radius-inner);
  padding: 28px 24px 24px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  background: var(--card-inner);
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  box-shadow: 0 2px 10px #0000000F;
}
/* Heavy grain inside cards - 12-15% opacity */
#message-card-inner::before,
.card-inner::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: var(--radius-inner);
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}
[data-theme="cream"] #message-card-inner::before,
[data-theme="sakura"] #message-card-inner::before,
[data-theme="ultramarine"] #message-card-inner::before,
[data-theme="cream"] .card-inner::before,
[data-theme="sakura"] .card-inner::before,
[data-theme="ultramarine"] .card-inner::before {
  mix-blend-mode: multiply;
}
/* Specular highlight top */
#message-card-inner::after {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 42%;
  pointer-events: none;
  border-radius: var(--radius-inner) var(--radius-inner) 0 0;
  background: linear-gradient(180deg, var(--glass-highlight) 0%, #FFFFFF00 100%);
  opacity: 0.9;
}
.message-display {
  min-height: 156px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.message-text {
  font-size: 28px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-align: left;
  color: var(--text);
  animation: fadeIn 0.45s cubic-bezier(0.32,0.72,0,1);
}
/* EDIT HERE: Empty state - no icon, 40% italic */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 8px 0;
}
.empty-state p {
  font-size: 18px;
  line-height: 1.45;
  font-weight: 500;
  font-style: italic;
  text-align: left;
  max-width: 300px;
  color: var(--text);
  opacity: 0.4;
}

/* ============================================
   6. PROGRESS BAR - 10 sec fill
   ============================================ */
#progress-bar {
  margin-top: 32px;
  position: relative;
  height: 2.5px;
  width: 100%;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--border);
  z-index: 1;
}
#progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  transition: width 50ms linear, background 400ms ease;
}
[data-theme="black"] #progress-fill { background: #F5F3EE; }
.progress-meta {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}
.progress-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ============================================
   7. WAVEFORM - 5 bars animated
   ============================================ */
#waveform {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 22px;
}
.waveform-bar {
  width: 8px;
  height: 18px;
  border-radius: 9999px;
  transform-origin: bottom;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
.waveform-bar:nth-child(1) { background: var(--wave-1); animation-name: wf1; animation-duration: 0.6s; animation-delay: -0.2s; }
.waveform-bar:nth-child(2) { background: var(--wave-2); animation-name: wf2; animation-duration: 0.75s; animation-delay: -0.5s; }
.waveform-bar:nth-child(3) { background: var(--wave-3); animation-name: wf3; animation-duration: 0.55s; animation-delay: -0.1s; }
.waveform-bar:nth-child(4) { background: var(--wave-4); animation-name: wf4; animation-duration: 0.8s; animation-delay: -0.7s; }
.waveform-bar:nth-child(5) { background: var(--wave-5); animation-name: wf5; animation-duration: 0.65s; animation-delay: -0.3s; }
.waveform-bar.paused { animation-play-state: paused; opacity: 0.42; }

/* ============================================
   8. CONTROLS - PAUSE, NEXT, FAVORITE
   ============================================ */
#controls {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  padding: 0 4px;
}
.btn {
  border-radius: var(--radius-pill);
  border: 1px solid var(--glass-border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  background: var(--pill-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 4px 14px #00000012;
  color: var(--text);
  transition: transform 200ms ease;
}
.btn:hover { transform: scale(1.02); }
.btn:active { transform: scale(0.97); }
.btn-ghost {
  flex: 1;
  padding: 13px 0;
}
.btn-fav {
  flex: 0.7;
  padding: 12px 0;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-fav.active {
  background: #FFE066EB;
  border-color: #FFD43B;
  color: #7A4A00;
  box-shadow: 0 6px 18px #FFD43B47, inset 0 1px 0 #FFFFFFCC;
}

/* ============================================
   9. ADD MESSAGE - textarea + button
   ============================================ */
#add-message-card {
  border-radius: var(--radius-outer);
  padding: 10px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 8px 24px var(--glass-shadow);
}
#add-message-card .card-inner {
  border-radius: var(--radius-inner);
  padding: 20px;
  border: 1px solid var(--glass-border);
  background: var(--card-inner);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
}
.add-header {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.add-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-dim);
}
.char-count {
  font-size: 10px;
  color: var(--text-muted);
}
#message-input {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 118px;
  border-radius: 18px;
  padding: 16px;
  font-size: 16px;
  line-height: 1.5;
  resize: none;
  outline: none;
  border: 1px solid var(--glass-border);
  background: var(--input-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.add-footer {
  position: relative;
  z-index: 1;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.add-hint {
  font-size: 10.5px;
  line-height: 1.3;
  max-width: 170px;
  color: var(--text-muted);
}
/* EDIT HERE: ADD TO STATION - high contrast */
.btn-primary {
  border-radius: var(--radius-pill);
  padding: 14px 24px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  border: 1px solid var(--border);
  background: var(--btn-primary-bg);
  color: var(--btn-primary-text);
  box-shadow: 0 6px 18px #00000029, inset 0 1px 0 var(--glass-highlight);
  transition: transform 200ms ease, filter 200ms ease;
}
.btn-primary:hover { transform: scale(1.03); filter: brightness(1.05); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled {
  background: var(--btn-ghost-bg);
  color: var(--text-muted);
  border-color: var(--glass-border);
  cursor: not-allowed;
  box-shadow: none;
}

/* ============================================
   10. NAVIGATION DRAWER - transparent blur 20px
   ============================================ */
#drawer-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #00000014;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
#nav-drawer {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 50;
  height: 100%;
  width: min(352px, 88vw);
  display: flex;
  flex-direction: column;
  border-top-right-radius: var(--radius-outer);
  border-bottom-right-radius: var(--radius-outer);
  border: 1px solid var(--border-light);
  border-left-width: 0;
  background: var(--drawer-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 8px 32px #00000014;
  padding-top: var(--safe-top);
  transition: transform 380ms cubic-bezier(0.32,0.72,0,1);
  overflow: hidden;
}
#nav-drawer.closed { transform: translateX(-100%); }
#nav-drawer.open { transform: translateX(0); }
.drawer-header {
  position: relative;
  z-index: 1;
  padding: 24px 24px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-circle {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
  background: var(--pill-bg-strong);
  backdrop-filter: blur(20px);
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  box-shadow: 0 4px 16px #0000000F;
}
.drawer-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text);
}
.beta-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  border: 1px solid var(--border-light);
  background: var(--btn-ghost-bg);
  color: var(--text-dim);
  backdrop-filter: blur(12px);
}
#drawer-close {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-light);
  background: var(--pill-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: transform 200ms ease;
}
#drawer-close:hover { transform: scale(1.05); }
#drawer-close:active { transform: scale(0.95); }
.drawer-body {
  position: relative;
  z-index: 1;
  padding: 8px 12px;
  flex: 1;
  overflow-y: auto;
}
.drawer-section {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  padding: 8px 12px;
  color: var(--text-muted);
}
.nav-item {
  width: 100%;
  text-align: left;
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--glass-border);
  margin-bottom: 8px;
  background: var(--pill-bg);
  backdrop-filter: blur(20px);
  color: var(--text);
  transition: transform 200ms ease;
}
.nav-item:hover { transform: scale(1.01); }
.nav-item:active { transform: scale(0.99); }
.nav-item.active {
  background: var(--pill-bg-strong);
  border-color: var(--border-light);
  box-shadow: 0 4px 16px #00000014;
  font-weight: 700;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.nav-icon { font-size: 13px; width: 20px; text-align: center; font-weight: 700; }
.nav-label { font-size: 13.5px; letter-spacing: 0.01em; }
.nav-count {
  font-size: 10px;
  letter-spacing: 0.06em;
  border-radius: var(--radius-pill);
  padding: 4px 10px;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg);
  font-weight: 700;
  color: var(--text-muted);
}

/* ============================================
   11. THEME SELECTOR - EDIT THEMES HERE
   ============================================ */
#theme-selector {
  margin-top: 24px;
}
.theme-list {
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  padding: 12px;
  margin-top: 4px;
  background: var(--pill-bg);
  backdrop-filter: blur(20px);
  box-shadow: 0 4px 16px #0000000D;
}
/* EDIT HERE: Theme option row */
.theme-option {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  min-height: 56px;
  transition: transform 200ms ease;
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 2px 8px #0000000A;
}
.theme-option:last-child { margin-bottom: 0; }
.theme-option:hover { transform: scale(1.01); }
.theme-option:active { transform: scale(0.98); }
.theme-option.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 2px 8px #0000000F;
}
.theme-left { display: flex; align-items: center; gap: 12px; }
.theme-dot {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-light);
  flex-shrink: 0;
}
.theme-meta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.theme-name { font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
.theme-hex { font-size: 10px; font-weight: 500; letter-spacing: 0.04em; margin-top: 2px; color: var(--text-dim); }
.theme-check {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 200ms ease;
}
.theme-check.selected { background: var(--accent); border-color: var(--accent); }
.theme-check-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: #FFFFFF;
}

/* ============================================
   12. ARCHIVE & FAVORITES PAGES
   ============================================ */
.page-stack { display: flex; flex-direction: column; gap: 16px; }
.page-header-card {
  border-radius: var(--radius-outer);
  padding: 20px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
.page-subtitle { font-size: 12px; margin-top: 4px; color: var(--text-dim); }
.list-card {
  border-radius: var(--radius-outer);
  padding: 10px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px);
}
.list-inner {
  border-radius: var(--radius-inner);
  border: 1px solid var(--glass-border);
  padding: 12px;
  background: var(--card-inner);
  position: relative;
  overflow: hidden;
}
.list-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  margin-bottom: 12px;
  padding: 0 8px;
  color: var(--text-muted);
}
.message-row {
  border-radius: var(--radius-inner);
  border: 1px solid var(--glass-border);
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: var(--pill-bg);
  backdrop-filter: blur(16px);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform 200ms ease;
}
.message-row:hover { transform: scale(1.01); }
.message-row.fav {
  border-color: #FFD43B6B;
  box-shadow: 0 6px 18px #FFD43B1F, inset 0 1px 0 var(--glass-highlight);
}
.row-main { flex: 1; }
.row-text { font-size: 13.5px; line-height: 1.35; font-weight: 500; color: var(--text); }
.row-meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--text-muted); }
.row-actions { display: flex; flex-direction: column; gap: 6px; }
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  background: var(--pill-bg);
  backdrop-filter: blur(20px);
  color: var(--text);
  transition: transform 200ms ease;
}
.icon-btn:hover { transform: scale(1.05); }
.icon-btn:active { transform: scale(0.95); }
.text-btn {
  border-radius: var(--radius-pill);
  padding: 6px 12px;
  font-size: 10px;
  font-weight: 700;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg);
  color: var(--text);
}

/* ============================================
   13. FOOTER - Designed with ♥ by Xavier + Build
   ============================================ */
#footer {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  padding: 0 4px;
}
.footer-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text);
  opacity: 0.9;
  align-self: flex-start;
}
.heart { display: inline-flex; animation: heartPulse 1.4s ease-in-out infinite; }
/* EDIT HERE: Buy me a coffee - left aligned fit-content */
#coffee-link {
  margin: 16px 0 32px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  border: 1px solid var(--glass-border);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  width: fit-content;
  background: var(--pill-bg);
  backdrop-filter: blur(20px);
  color: var(--text);
  text-decoration: none;
  align-self: flex-start;
  transition: transform 200ms ease;
}
#coffee-link:hover { transform: scale(1.03); }
#coffee-link:active { transform: scale(0.97); }
/* EDIT HERE: Build number - left aligned mono 35% opacity */
#build-number {
  font-size: 10px;
  letter-spacing: 0.08em;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  align-self: flex-start;
  color: var(--text);
  opacity: 0.35;
}

/* ============================================
   14. WELCOME MODAL - transparent blur 20px
   ============================================ */
#welcome-overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop {
  position: absolute;
  inset: 0;
  border: 0;
  background: var(--modal-overlay);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: opacity 280ms ease;
}
.modal-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  border-radius: 32px;
  padding: 10px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 20px 60px #00000052;
  transition: transform 360ms cubic-bezier(0.32,0.72,0,1), opacity 280ms ease;
}
.modal-card.enter { transform: scale(1) translateY(0); opacity: 1; }
.modal-card.exit { transform: scale(0.96) translateY(8px); opacity: 0; }
.modal-inner {
  border-radius: 24px;
  border: 1px solid var(--glass-border);
  padding: 24px;
  position: relative;
  overflow: hidden;
  background: var(--card-inner);
}
.modal-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 12px;
  color: var(--text);
}
.modal-body {
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-emphasis {
  font-weight: 600;
  color: var(--text);
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  border-radius: var(--radius-pill);
  padding: 12px 20px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg-strong);
  backdrop-filter: blur(20px);
  color: var(--text);
  box-shadow: 0 8px 24px #0000002E;
  max-width: 90vw;
  text-align: center;
  animation: toastIn 0.38s cubic-bezier(0.32,0.72,0,1);
}

/* ============================================
   15. UTILITIES - grain, shadows, animations
   ============================================ */
@keyframes wf1 { 0%,100%{transform:scaleY(0.35)} 50%{transform:scaleY(1)} }
@keyframes wf2 { 0%,100%{transform:scaleY(0.55)} 50%{transform:scaleY(0.9)} }
@keyframes wf3 { 0%,100%{transform:scaleY(0.28)} 50%{transform:scaleY(1.1)} }
@keyframes wf4 { 0%,100%{transform:scaleY(0.45)} 50%{transform:scaleY(0.85)} }
@keyframes wf5 { 0%,100%{transform:scaleY(0.38)} 50%{transform:scaleY(1.05)} }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes heartPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) translateX(-50%) scale(0.96); } to { opacity: 1; transform: translateY(0) translateX(-50%) scale(1); } }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Helper for settings input */
.settings-input {
  width: 100%;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 16px;
  font-weight: 600;
  border: 1px solid var(--glass-border);
  outline: none;
  background: var(--input-bg);
  backdrop-filter: blur(12px);
  color: var(--text);
}
.settings-hint { font-size: 10px; margin-top: 8px; color: var(--text-muted); }
.card-inner { position: relative; overflow: hidden; }

/* ============================================
   2. RESET & BASE - EDIT GLOBAL STYLES HERE
   ============================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { background: var(--bg); overscroll-behavior: none; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}
/* iOS no-zoom - 16px prevents auto-zoom */
input, textarea, select { font-size: 16px !important; }
button { font-family: inherit; cursor: pointer; }

/* ============================================
   3. LAYOUT - CONTAINERS
   ============================================ */
#app-root {
  min-height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
  position: relative;
  overflow-x: clip;
  overflow-y: auto;
  padding-top: var(--safe-top);
  background: var(--bg);
  color: var(--text);
  transition: background 400ms ease, color 400ms ease;
}
/* Ambient glow - solid only, no grey pull */
.ambient-glow {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.ambient-blob {
  position: absolute;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: min(860px, 92vw);
  max-width: 92vw;
  height: 720px;
  border-radius: 9999px;
  filter: blur(120px);
  transition: all 600ms ease;
}
/* Main shell - 430px max like phone */
#main-shell {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 430px;
  padding: 24px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ============================================
   4. HEADER - STATION NAME & ON AIR
   ============================================ */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* EDIT HERE: Menu button - hamburger */
#menu-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--pill-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 4px 14px #00000012;
  transition: transform 200ms ease;
}
#menu-btn:hover { transform: scale(1.04); }
#menu-btn:active { transform: scale(0.96); }
#menu-btn span {
  display: block;
  width: 16px;
  height: 1.6px;
  border-radius: 9999px;
  background: var(--text);
}
/* EDIT HERE: Station name pill */
#station-pill {
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: var(--radius-pill);
  padding: 6px 6px 6px 18px;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 4px 14px #00000012;
  transition: transform 200ms ease;
}
#station-pill:hover { transform: scale(1.02); }
#station-pill:active { transform: scale(0.98); }
.station-name-text {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
}
/* EDIT HERE: Rename icon - needs good contrast */
.rename-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
  background: var(--btn-ghost-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 200ms ease;
}
.rename-icon svg path {
  stroke: var(--text-dim);
}
[data-theme="ultramarine"] .rename-icon svg path {
  stroke: #0044FF;
}
.rename-icon:hover { transform: scale(1.05); }
/* EDIT HERE: Station edit input */
#station-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--radius-pill);
  padding: 9px 16px;
  border: 1px solid var(--glass-border);
  background: var(--pill-bg-strong);
  backdrop-filter: blur(20px);
}
#station-edit input {
  background: transparent;
  border: 0;
  outline: 0;
  width: 120px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
/* EDIT HERE: ON AIR pill */
#on-air-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  border-radius: var(--radius-pill);
  padding: 10px 14px;
  border: 1px solid var(--glass-border);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: all 400ms ease, transform 200ms ease;
  background: var(--pill-bg);
  color: #8A8A8A;
}
#on-air-btn.live {
  background: var(--live-bg);
  border-color: var(--live-border);
  color: var(--live-text);
  box-shadow: 0 0 0 1px var(--live-border), 0 0 22px var(--live-dot);
}
#on-air-btn:hover { transform: scale(1.02); }
#on-air-btn:active { transform: scale(0.97); }
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: #B0B0B0;
}
#on-air-btn.live .live-dot {
  background: var(--live-dot);
  box-shadow: 0 0 10px var(--live-dot);
  animation: pulseDot 1.4s ease-in-out infinite;
}

/* ============================================
   5. MESSAGE DISPLAY - MAIN CARD
   ============================================ */
/* EDIT HERE: Outer card - parent 20px radius */
#station-card {
  border-radius: var(--radius-outer);
  padding: 10px;
  border: 1px solid var(--glass-border);
  background: var(--card-outer);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  box-shadow: 0 8px 24px var(--glass-shadow);
  transition: all 400ms ease;
}
/* EDIT HERE: Inner card - nested 12px radius, uniform spacing */
#message-card-inner {
  border-radius: var(--radius-inner);
  padding: 28px 24px 24px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  background: var(--card-inner);
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  box-shadow: 0 2px 10px #0000000F;
}
/* Heavy grain inside cards - 12-15% opacity */
#message-card-inner::before,
.card-inner::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: var(--radius-inner);
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}
[data-theme="cream"] #message-card-inner::before,
[data-theme="sakura"] #message-card-inner::before,
[data-theme="ultramarine"] #message-card-inner::before,
[data-theme="cream"] .card-inner::before,
[data-theme="sakura"] .card-inner::before,
[data-theme="ultramarine"] .card-inner::before {
  mix-blend-mode: multiply;
}
/* Specular highlight top */
#message-card-inner::after {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 42%;
  pointer-events: none;
  border-radius: var(--radius-inner) var(--radius-inner) 0 0;
  background: linear-gradient(180deg, var(--glass-highlight) 0%, #FFFFFF00 100%);
  opacity: 0.9;
}
.message-display {
  min-height: 156px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.message-text {
  font-size: 28px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-align: left;
  color: var(--text);
  animation: fadeIn 0.45s cubic-bezier(0.32,0.72,0,1);
}
/* EDIT HERE: Empty state - no icon, 40% italic */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 8px 0;
}
.empty-state p {
  font-size: 18px;
  line-height: 1.45;
  font-weight: 500;
  font-style: italic;
  text-align: left;
  max-width: 300px;
  color: var(--text);
  opacity: 0.4;
}

/* ============================================
   6. PROGRESS BAR - 10 sec fill
   ============================================ */
#progress-bar {
  margin-top: 32px;
  position: relative;
  height: 2.5px;
  width: 100%;
  border-radius: var(--radius-pill);
  overflow: hidden;
  background: var(--border);
  z-index: 1;
}
#progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  transition: width 50ms linear, background 400ms ease;
}
[data-theme="black"] #progress-fill { background: #F5F3EE; }
.progress-meta {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}
.progress-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ============================================
   7. WAVEFORM - 5 bars animated
   ============================================ */
#waveform {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 22px;
}
.waveform-bar {
  width: 8px;
  height: 18px;
  border-radius: 9999px;
  transform-origin: bottom;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
.waveform-bar:nth-child(1) { background: var(--wave-1); animation-name: wf1; animation-duration: 0.6s; animation-delay: -0.2s; }
.waveform-bar:nth-child(2) { background: var(--wave-2); animation-name: wf2; animation-duration: 0.75s; animation-delay: -0.5s; }
.waveform-bar:nth-child(3) { background: var(--wave-3); animation-name: wf3; animation-duration: 0.55s; animation-delay: -0.1s; }
.waveform-bar:nth-child(4) { background: var(--wave-4); animation-name: wf4; animation-duration: 0.8s; animation-delay: -0.7s; }
.waveform-bar:nth-child(5) { background: var(--wave-5); animation-name: wf5; animation-duration: 0.65s; animation-delay: -0.3s; }
.waveform-bar.paused { animation-play-state: paused; opacity: 0.42; }

/* ============================================

@keyframes wf1 { 0%,100%{transform:scaleY(0.35)} 50%{transform:scaleY(1)} }

.card-inner { position: relative; overflow: hidden; }
